<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>World Cooking Challenge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <a class="brand" href="{{ url_for('index') }}">
                <span class="brand-mark">Taste the World</span>
                <span class="brand-subtitle">Cooking Competition Registration</span>
            </a>
            <nav class="site-nav">
                <a href="{{ url_for('index') }}">Register</a>
                <a href="{{ url_for('team') }}">My Team</a>
                <a href="{{ url_for('admin_login') }}">Organizer</a>
            </nav>
        </header>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <section class="flash-stack">
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </section>
            {% endif %}
        {% endwith %}

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
