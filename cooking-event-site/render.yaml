services:
  - type: web
    name: world-cooking-challenge
    runtime: python
    plan: free
    region: frankfurt
    rootDir: cooking-event-site
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: EVENT_ADMIN_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: SESSION_COOKIE_SECURE
        value: "1"
 
